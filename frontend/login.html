<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FloatYourBoat — Login</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="auth-container">
    <div class="auth-box">
      <!-- Logo -->
      <div class="auth-logo">
        <span class="logo-icon">⚓</span>
        <h1>FloatYourBoat</h1>
        <p>Your marketplace for buying &amp; selling boats</p>
      </div>

      <!-- Tabs -->
      <div class="auth-tabs">
        <button class="auth-tab active" id="tab-login" onclick="switchTab('login')">Log In</button>
        <button class="auth-tab" id="tab-register" onclick="switchTab('register')">Register</button>
      </div>

      <!-- Error / Success messages -->
      <div id="auth-alert" class="alert alert-danger hidden">
        <span id="auth-alert-msg"></span>
        <button class="close-btn" onclick="hideAlert()">✕</button>
      </div>

      <!-- Login Form -->
      <form id="form-login" class="auth-form active" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="login-username">Username</label>
          <input type="text" id="login-username" placeholder="Enter your username" autocomplete="username" required />
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg">Log In</button>
        <p class="text-center mt-2" style="font-size:0.85rem; color: var(--mid-gray);">
          Demo usernames: <code>alice_buyer</code> &nbsp;|&nbsp; <code>bob_seller</code>
        </p>
      </form>

      <!-- Register Form -->
      <form id="form-register" class="auth-form" onsubmit="handleRegister(event)">
        <div class="form-group">
          <label>I am a…</label>
          <div class="role-selector">
            <button type="button" class="role-option selected" id="role-buyer" onclick="selectRole('buyer')">
              <span class="role-icon">🔍</span>
              Buyer
            </button>
            <button type="button" class="role-option" id="role-seller" onclick="selectRole('seller')">
              <span class="role-icon">📋</span>
              Seller
            </button>
          </div>
          <input type="hidden" id="reg-role" value="buyer" />
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="reg-name">Full Name</label>
            <input type="text" id="reg-name" placeholder="Jane Smith" required />
          </div>
          <div class="form-group">
            <label for="reg-email">Email</label>
            <input type="email" id="reg-email" placeholder="jane@example.com" required />
          </div>
        </div>
        <div class="form-group">
          <label for="reg-username">Username</label>
          <input type="text" id="reg-username" placeholder="Choose a username" autocomplete="username" required />
        </div>
        <div class="form-group" id="reg-location-group">
          <label for="reg-location">Your Location</label>
          <input type="text" id="reg-location" placeholder="City, State" required />
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg">Create Account</button>
      </form>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script>
    FYB.initData();

    // If already logged in, go to browse
    if (FYBAuth.getCurrentUser()) {
      window.location.href = '/';
    }

    function switchTab(tab) {
      document.getElementById('form-login').classList.toggle('active', tab === 'login');
      document.getElementById('form-register').classList.toggle('active', tab === 'register');
      document.getElementById('tab-login').classList.toggle('active', tab === 'login');
      document.getElementById('tab-register').classList.toggle('active', tab === 'register');
      hideAlert();
    }

    function selectRole(role) {
      document.getElementById('reg-role').value = role;
      document.getElementById('role-buyer').classList.toggle('selected', role === 'buyer');
      document.getElementById('role-seller').classList.toggle('selected', role === 'seller');
      const locationGroup = document.getElementById('reg-location-group');
      const locationInput = document.getElementById('reg-location');
      const isBuyer = role === 'buyer';
      locationGroup.classList.toggle('hidden', !isBuyer);
      locationInput.required = isBuyer;
      if (!isBuyer) locationInput.value = '';
    }

    function showAlert(msg, type = 'danger') {
      const el = document.getElementById('auth-alert');
      el.className = `alert alert-${type}`;
      document.getElementById('auth-alert-msg').textContent = msg;
    }

    function hideAlert() {
      document.getElementById('auth-alert').classList.add('hidden');
    }

    function handleLogin(e) {
      e.preventDefault();
      const username = document.getElementById('login-username').value;
      const result = FYBAuth.login(username);
      if (result.error) {
        showAlert(result.error);
      } else {
        window.location.href = '/';
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      const name     = document.getElementById('reg-name').value;
      const email    = document.getElementById('reg-email').value;
      const username = document.getElementById('reg-username').value;
      const role     = document.getElementById('reg-role').value;
      const location = document.getElementById('reg-location').value;

      if (role === 'buyer') {
        let geo;
        try {
          geo = await FYB.geocodeLocation(location);
        } catch (err) {
          console.error('Registration geocoding failed:', err);
          showAlert(`Map service unavailable: ${err?.message || 'unknown error'}.`);
          return;
        }
        if (!geo) {
          showAlert('Invalid city/location. Please enter a valid city.');
          return;
        }
      }

      const result = FYBAuth.register(username, name, email, role, location);
      if (result.error) {
        showAlert(result.error);
      } else {
        window.location.href = '/';
      }
    }

  </script>
</body>
</html>
