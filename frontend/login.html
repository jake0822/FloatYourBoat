<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FloatYourBoat — Login</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="auth-container">
    <div class="auth-box">
      <!-- Logo -->
      <div class="auth-logo">
        <span class="logo-icon">⚓</span>
        <h1>FloatYourBoat</h1>
        <p>Your marketplace for buying &amp; selling boats</p>
      </div>

      <!-- Tabs -->
      <div class="auth-tabs">
        <button class="auth-tab active" id="tab-login" onclick="switchTab('login')">Log In</button>
        <button class="auth-tab" id="tab-register" onclick="switchTab('register')">Register</button>
      </div>

      <!-- Error / Success messages -->
      <div id="auth-alert" class="alert alert-danger hidden">
        <span id="auth-alert-msg"></span>
        <button class="close-btn" onclick="hideAlert()">✕</button>
      </div>

      <!-- Login Form -->
      <form id="form-login" class="auth-form active" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="login-username">Username</label>
          <input type="text" id="login-username" placeholder="Enter your username" autocomplete="username" required />
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg">Log In</button>
        <p class="text-center mt-2" style="font-size:0.85rem; color: var(--mid-gray);">
          Demo usernames: <code>alice_buyer</code> &nbsp;|&nbsp; <code>bob_seller</code>
        </p>
      </form>

      <!-- Register Form -->
      <form id="form-register" class="auth-form" onsubmit="handleRegister(event)">
        <div class="form-group">
          <label>I am a…</label>
          <div class="role-selector">
            <button type="button" class="role-option selected" id="role-buyer" onclick="selectRole('buyer')">
              <span class="role-icon">🔍</span>
              Buyer
            </button>
            <button type="button" class="role-option" id="role-seller" onclick="selectRole('seller')">
              <span class="role-icon">📋</span>
              Seller
            </button>
          </div>
          <input type="hidden" id="reg-role" value="buyer" />
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="reg-name">Full Name</label>
            <input type="text" id="reg-name" placeholder="Jane Smith" required />
          </div>
          <div class="form-group">
            <label for="reg-email">Email</label>
            <input type="email" id="reg-email" placeholder="jane@example.com" required />
          </div>
        </div>
        <div class="form-group">
          <label for="reg-username">Username</label>
          <input type="text" id="reg-username" placeholder="Choose a username" autocomplete="username" required />
        </div>
        <div class="form-row" id="reg-location-group">
          <div class="form-group">
            <label for="reg-state">Your State</label>
            <select id="reg-state" required>
              <option value="">Select state</option>
            </select>
          </div>
          <div class="form-group">
            <label for="reg-city">Your City (Or Closest One)</label>
            <select id="reg-city" required disabled>
              <option value="">Select city</option>
            </select>
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg">Create Account</button>
      </form>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await FYB.initData();
      setupRegistrationLocationSelectors();

      // If already logged in, go to browse
      if (FYBAuth.getCurrentUser()) {
        window.location.href = '/';
      }
    });

    function setupRegistrationLocationSelectors() {
      const stateSelect = document.getElementById('reg-state');
      const citySelect = document.getElementById('reg-city');
      if (!stateSelect || !citySelect) return;

      const locations = FYB.BUYER_LOCATIONS || {};
      stateSelect.replaceChildren();
      const statePlaceholder = document.createElement('option');
      statePlaceholder.value = '';
      statePlaceholder.textContent = 'Select state';
      stateSelect.appendChild(statePlaceholder);

      const sortedStates = Object.entries(locations).sort((a, b) => a[1].label.localeCompare(b[1].label));
      for (const [code, state] of sortedStates) {
        const option = document.createElement('option');
        option.value = code;
        option.textContent = state.label;
        stateSelect.appendChild(option);
      }

      stateSelect.addEventListener('change', () => {
        renderRegistrationCities(stateSelect.value);
      });

      renderRegistrationCities('');
    }

    function renderRegistrationCities(stateCode) {
      const citySelect = document.getElementById('reg-city');
      const state = (FYB.BUYER_LOCATIONS || {})[stateCode];
      citySelect.replaceChildren();

      const placeholder = document.createElement('option');
      placeholder.value = '';
      placeholder.textContent = 'Select city';
      citySelect.appendChild(placeholder);

      if (state) {
        for (const city of state.cities) {
          const option = document.createElement('option');
          option.value = city.name;
          option.textContent = city.name;
          citySelect.appendChild(option);
        }
      }

      citySelect.disabled = !state;
    }

    function formatBuyerLocation(cityName, stateCode) {
      return `${cityName}, ${stateCode}`;
    }

    function switchTab(tab) {
      document.getElementById('form-login').classList.toggle('active', tab === 'login');
      document.getElementById('form-register').classList.toggle('active', tab === 'register');
      document.getElementById('tab-login').classList.toggle('active', tab === 'login');
      document.getElementById('tab-register').classList.toggle('active', tab === 'register');
      hideAlert();
    }

    function selectRole(role) {
      document.getElementById('reg-role').value = role;
      document.getElementById('role-buyer').classList.toggle('selected', role === 'buyer');
      document.getElementById('role-seller').classList.toggle('selected', role === 'seller');
      const locationGroup = document.getElementById('reg-location-group');
      const stateSelect = document.getElementById('reg-state');
      const citySelect = document.getElementById('reg-city');
      const isBuyer = role === 'buyer';
      locationGroup.classList.toggle('hidden', !isBuyer);
      stateSelect.required = isBuyer;
      citySelect.required = isBuyer;
      if (!isBuyer) {
        stateSelect.value = '';
        renderRegistrationCities('');
      }
    }

    function showAlert(msg, type = 'danger') {
      const el = document.getElementById('auth-alert');
      el.className = `alert alert-${type}`;
      document.getElementById('auth-alert-msg').textContent = msg;
    }

    function hideAlert() {
      document.getElementById('auth-alert').classList.add('hidden');
    }

    function handleLogin(e) {
      e.preventDefault();
      const username = document.getElementById('login-username').value;
      const result = FYBAuth.login(username);
      if (result.error) {
        showAlert(result.error);
      } else {
        window.location.href = '/';
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      const name     = document.getElementById('reg-name').value;
      const email    = document.getElementById('reg-email').value;
      const username = document.getElementById('reg-username').value;
      const role     = document.getElementById('reg-role').value;
      const stateCode = document.getElementById('reg-state').value;
      const cityName = document.getElementById('reg-city').value;
      const location = role === 'buyer' ? formatBuyerLocation(cityName, stateCode) : '';

      if (role === 'buyer') {
        if (!stateCode || !cityName) {
          showAlert('Please select your state and city.');
          return;
        }
      }

      const result = await FYBAuth.register(username, name, email, role, location);
      if (result.error) {
        showAlert(result.error);
      } else {
        window.location.href = '/';
      }
    }

  </script>
</body>
</html>
