<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FloatYourBoat — Edit Account</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="navbar" id="navbar"></header>

  <div class="auth-container">
    <div class="auth-box">
      <!-- Logo -->
      <div class="auth-logo">
        <span class="logo-icon">⚓</span>
        <h1>Edit Account</h1>
        <p>Update your profile information</p>
      </div>

      <!-- Error / Success messages -->
      <div id="auth-alert" class="alert alert-danger hidden">
        <span id="auth-alert-msg"></span>
        <button class="close-btn" onclick="hideAlert()">✕</button>
      </div>

      <!-- Edit Account Form -->
      <form id="form-edit-account" class="auth-form active" onsubmit="handleEditAccount(event)">
        <div class="form-group">
          <label for="edit-name">Full Name</label>
          <input type="text" id="edit-name" placeholder="Enter your full name" required />
        </div>

        <!-- Buyer-specific fields -->
        <div id="buyer-fields" style="display: none;">
          <div class="form-row">
            <div class="form-group">
              <label for="edit-state">Your State</label>
              <select id="edit-state">
                <option value="">Select state</option>
              </select>
            </div>
            <div class="form-group">
              <label for="edit-city">Your City</label>
              <select id="edit-city" disabled>
                <option value="">Select city</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Seller-specific fields -->
        <div id="seller-fields" style="display: none;">
          <div class="form-group">
            <label for="edit-email">Email</label>
            <input type="email" id="edit-email" placeholder="Enter your email" />
          </div>
        </div>

        <div class="form-row" style="gap: 1rem;">
          <button type="submit" class="btn btn-primary btn-block btn-lg">Done</button>
          <button type="button" class="btn btn-outline btn-block btn-lg" onclick="window.location.href='/'">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/edit-account.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      FYBAuth.renderNav();
      await FYB.initData();
      FYBAuth.requireAuth();
      initEditAccountPage();
      setupEditAccountLocationSelectors();
    });
  </script>
</body>
</html>
